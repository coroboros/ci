# Self-CI Security
name: Self-CI Security

# Local `./` refs so a PR self-tests its own security composites and workflows.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/security/gitleaks

  scan-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/security/osv-scanner

  security-gate:
    uses: ./.github/workflows/security-gate.yml

  security:
    uses: ./.github/workflows/security.yml
